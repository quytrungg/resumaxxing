<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Resumaxxing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- resume sheet -->
  <rect x="120" y="96" width="212" height="292" rx="28" fill="#ffffff" />
  <rect x="120" y="96" width="212" height="60" rx="28" fill="#eef2ff" />
  <rect x="120" y="128" width="212" height="28" fill="#eef2ff" />

  <!-- name / headline -->
  <rect x="152" y="118" width="104" height="18" rx="9" fill="#4f46e5" />
  <rect x="152" y="184" width="148" height="16" rx="8" fill="#c7d2fe" />
  <!-- body lines -->
  <rect x="152" y="228" width="148" height="14" rx="7" fill="#e2e8f0" />
  <rect x="152" y="260" width="148" height="14" rx="7" fill="#e2e8f0" />
  <rect x="152" y="292" width="112" height="14" rx="7" fill="#e2e8f0" />
  <rect x="152" y="324" width="132" height="14" rx="7" fill="#e2e8f0" />

  <!-- boost badge -->
  <circle cx="368" cy="368" r="104" fill="url(#badge)" stroke="#ffffff" stroke-width="16" />
  <!-- rising arrow: shaft up-right -->
  <path d="M304 424 L404 324" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
  <!-- arrowhead -->
  <path d="M352 316 H412 V376" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
</svg>
